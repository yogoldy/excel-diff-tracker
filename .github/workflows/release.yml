name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version, without a leading v
        required: true
        default: 0.1.1

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.400
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ($actualHash -ne $expectedHash) { throw "Unexpected Inno Setup hash: $actualHash" }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
      - name: Build unpromoted candidate bundle
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ExcelDiffTracker-v${{ inputs.version }}-arm64-UNTESTED
          path: artifacts/release/*
