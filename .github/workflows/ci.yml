name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore .\ExcelDiffTracker.slnx
      - run: dotnet build .\ExcelDiffTracker.slnx -c Release --no-restore
      - run: dotnet test .\ExcelDiffTracker.slnx -c Release --no-build
      - run: dotnet publish .\src\ExcelDiffTracker.App\ExcelDiffTracker.App.csproj -c Release -r win-arm64 --self-contained true --no-restore
